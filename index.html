<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neon Music Player</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <!-- <div class="player-header">
        <h1>Music Player</h1>
    </div> -->

    <div class="background">
            <!-- List of orbs floating in the background -->
    </div>
    
    <main class="music-player">

        <!-- Album Cover -->
        <div class="album-container">
            <img
                id="album-cover"
                src="images/ee64fad515bf0b8a03ffb21e964eab61.jpg"
                alt="Album cover"
            >
        </div>


        <!-- Song Information -->
        <div class="song-info">
            <h2 id="song-title">Midnight City</h2>
            <p id="artist-name">M83</p>
        </div>


        <!-- Progress -->
        <div class="progress-container">
            <label for="progress-bar" class="sr-only">Song progress</label>
            <input
                type="range"
                id="progress-bar"
                min="0"
                max="100"
                value="0"
                oninput="seekAudioTime()"
            >

            <div class="time-container">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>


        <!-- Music Controls -->
        <div class="controls">
            <button id="previous-btn" class="btn">⏮</button>

            <button id="play-btn" class="btn play-btn">
                ▶
            </button>

            <button id="pause-btn" class="btn play-btn">
                ||
            </button>

            <button id="next-btn" class="btn">⏭</button>

            <button id="repeat-btn" class="btn">↻</button>

            <button id="like-btn" class="btn">♡</button>

        </div>


        <!-- Volume -->
        <div class="volume-container">
            <label for="volume">Volume</label>

            <span>🕪</span>

            <input
                type="range"
                id="volume"
                onchange="setVolume()"
                min=0 
                max=1 
                step=0.01 
                value='0.30'
                >
        </div>


        <!-- Audio -->
        <audio id="audio">
            <source src="music/alanajordan-so-random-495791.mp3" type="audio/mpeg">
            <source src="music/julytmusic-random-acoustic-electronic-guitar-136427.mp3">
        </audio>

    </main>


    <script src="script.js"></script>
</body>
</html>
